name: Publish to pub.dev

# Automated publishing to pub.dev via OIDC (no long-lived token).
# Prerequisite: publish the package once manually (`dart pub publish`), then on
# pub.dev enable Admin → Automated publishing for repo `subfay/subfay-flutter`
# with tag pattern `v{{version}}`. After that, pushing a tag like v1.2.3 here
# publishes that version.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  publish:
    permissions:
      id-token: write # required for OIDC auth to pub.dev
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
